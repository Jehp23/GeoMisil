<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GeoMisil</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>GeoMisil</h1>
  </header>

  <main>
    <div id="map"></div>

    <div class="controls panel">
      <button id="btnLocate">📍 Posición actual</button>
      <button id="btnFire">🔥 Disparar misil</button>
      <!-- Seguimiento -->
      <button id="btnTrackStart" class="ghost">▶ Seguir</button>
      <button id="btnTrackStop" class="ghost" disabled>■ Detener</button>
      <button id="btnExport" class="ghost">⤵ Exportar CSV</button>
      <button id="btnClearHistory" class="ghost danger">🗑 Borrar historial</button>
      <button id="btnToggleHistory" class="ghost">🧭 Ver historial</button>
    </div>

    <div id="info-panel" class="panel">
      <b>Estado</b>
      <pre id="status">Listo.</pre>
    </div>

    <!-- Panel Historial -->
    <div id="history-panel" class="panel history hidden" aria-live="polite">
      <div class="history-header">
        <b>Historial de posiciones</b>
        <span id="history-count">0</span>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </div>

    <div id="explosion-root"></div>
  </main>

  <!-- Leaflet -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./script.js"></script>
</body>
</html>
